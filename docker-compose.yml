
# GuardX — service orchestration (Phase 1)
# Default: postgres + chromadb + backend + frontend.
# n8n is profile-gated: docker compose --profile automation up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-guardx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma-data:/data
    ports:
      - "8001:8000"

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-guardx}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-guardx}
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://host.docker.internal:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      FRONTEND_URL: http://localhost:3000
      N8N_ENABLED: ${N8N_ENABLED:-false}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      N8N_WEBHOOK_TIMEOUT_SECONDS: ${N8N_WEBHOOK_TIMEOUT_SECONDS:-5}
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.5}
    ports:
      - "8000:8000"
    volumes:
      - ./assets:/app/assets
      - ./backend/assets:/app/backend_assets:ro
      - ./demo:/app/demo:ro
      - ./policies:/policies:ro
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n
    profiles: ["automation"]
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  pgdata:
  chroma-data:
  n8n-data:
